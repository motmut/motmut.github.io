<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MiawTip.co - Konfirmasi</title>
</head>

<body bgcolor="#aed6f1">

    <!-- Header -->
    <header>
        <table width="100%" border="0" cellpadding="10">
            <tr>
                <td align="center">
                    <a href="index.html" style="text-decoration: none; color: black;">
                        <h2 style="font-size: 18px; margin: 0;">MiawTip.co</h2>
                    </a>
                </td>
            </tr>
        </table>

        <hr align="center" width="100%" color="black" size="2">
    </header>

    <br><br>

    <!-- Kotak Konfirmasi -->
    <main>
        <center>

            <table 
                border="0" 
                cellpadding="20" 
                cellspacing="0" 
                width="380" 
                bgcolor="#e6f2ff"
                style="
                    border-radius: 8px;
                    box-shadow: 0px 5px 12px rgba(0,0,0,0.20);
                "
            >
                <tr>
                    <td align="center">

                        <!-- Judul -->
                        <h3 style="margin-bottom: 20px;">
                            MiawTip Confirm!
                        </h3>

                        <!-- Pesan Terima Kasih -->
                        <p>
                            <b>Terima kasih Sudah Mendukung</b>
                        </p>

                        <!-- Informasi Dukungan -->
                        <table 
                            border="0" 
                            cellpadding="8" 
                            cellspacing="0" 
                            width="80%"
                            bgcolor="#909090"
                            style="
                                border-radius: 6px;
                                box-shadow: 3px 3px 5px rgba(0,0,0,0.25);
                            "
                        >
                            <tr>
                                <td align="center">
                                    <font color="white">
                                        <b>Kreator A</b>
                                    </font>
                                </td>
                            </tr>
                        </table>

                        <br>

                        <!-- Nominal -->
                        <p>
                            <b>Nominal</b>
                        </p>

                        <table 
                            border="0" 
                            cellpadding="8" 
                            cellspacing="0" 
                            width="60%"
                            bgcolor="#909090"
                            style="
                                border-radius: 6px;
                                box-shadow: 3px 3px 5px rgba(0,0,0,0.25);
                            "
                        >
                            <tr>
                                <td align="center">
                                    <font color="white">
                                        <b>Rp 20.000</b>
                                    </font>
                                </td>
                            </tr>
                        </table>

                        <br>

                        <!-- Pesan Berhasil -->
                        <p>
                            <b>Pesanan Anda Telah Berhasil Terkirim</b>
                        </p>

                        <br>

                        <!-- Tombol Kembali -->
                        <a href="index.html" style="text-decoration: none;">
                            <button 
                                type="button"
                                style="
                                    width: 100px;
                                    padding: 9px;
                                    background-color: #3182ce;
                                    color: white;
                                    border: none;
                                    font-weight: bold;
                                    cursor: pointer;
                                    border-radius: 5px;
                                    box-shadow: 3px 3px 5px rgba(0,0,0,0.25);
                                "
                            >
                                Kembali
                            </button>
                        </a>

                    </td>
                </tr>
            </table>

        </center>
    </main>

</body>
</html>
