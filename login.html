<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MiawTip.co - Login</title>
</head>
<body bgcolor="#aed6f1">

    <!-- Header / Navigasi Utama -->
    <header>
        <table width="100%" border="0" cellpadding="10">
            <tr>
                <td align="left">
                    <!-- Klik Logo/Nama untuk kembali ke Beranda -->
                    <a href="index.html" style="text-decoration: none; color: black;"><h2>MiawTip.co</h2></a>
                </td>
                <td align="right">
                    <a href="login.html"><button type="button">LOGIN</button></a>
                    <a href="daftar.html" style="text-decoration: none; color: black; font-weight: bold; margin-left: 10px;">Daftar</a>
                </td>
            </tr>
        </table>
        <hr align="center" width="100%" color="black" size="2">
    </header>

    <br><br>

    <!-- Form Login Utama -->
    <main>
        <center>
            <table border="1" cellpadding="20" cellspacing="0" width="380" bgcolor="#f0f8ff">
                <tr>
                    <td>
                        <form action="" method="POST">
                            
                            <!-- Judul Form -->
                            <h2 align="center">Login</h2>

                            <!-- Input Email -->
                            <p>
                                <label for="email"><b>Email</b></label><br>
                                <input type="email" id="email" name="email" placeholder="Masukkan email" required style="width: 95%; padding: 8px; margin-top: 5px;">
                            </p>

                            <!-- Input Password -->
                            <p>
                                <label for="password"><b>Password</b></label><br>
                                <input type="password" id="password" name="password" placeholder="Masukkan password" required style="width: 95%; padding: 8px; margin-top: 5px;">
                            </p>

                            <!-- Checkbox Ingatkan Saya -->
                            <p>
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember"><b>ingatkan saya</b></label>
                            </p>

                            <br>

                            <!-- Tombol Submit Masuk -->
                            <p align="center">
                                <button type="submit" style="width: 100%; padding: 10px; background-color: #3182ce; color: white; border: none; font-weight: bold; cursor: pointer;">
                                    MASUK
                                </button>
                            </p>

                            <!-- Link Lupa Kata Sandi & Daftar -->
                            <p align="center" style="font-size: 14px;">
                                <a href="#" style="text-decoration: none; color: black;"><b>lupa kata sandi?</b></a>
                            </p>
