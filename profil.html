<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>MiawTip.co - Profil</title>
</head>

<body
    bgcolor="#aed6f1"
    style="
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    "
>

    <!-- ================= HEADER ================= -->

    <table
        width="100%"
        height="50"
        border="0"
        cellpadding="0"
        cellspacing="0"
        style="border-bottom: 2px solid black;"
    >
        <tr>

            <td
                valign="middle"
                style="padding-left: 18px;"
            >

                <a
                    href="index.html"
                    style="
                        text-decoration: none;
                        color: black;
                        font-size: 16px;
                        font-weight: bold;
                    "
                >
                    MiawTip.co
                </a>

            </td>

        </tr>
    </table>


    <!-- ================= LAYOUT UTAMA ================= -->

    <table
        width="100%"
        border="0"
        cellpadding="0"
        cellspacing="0"
    >

        <tr>

            <!-- ================= SIDEBAR ================= -->

            <td
                width="180"
                valign="top"
                style="
                    border-right: 2px solid black;
                    height: 600px;
                "
            >

                <table
                    width="100%"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                >

                    <!-- DASHBOARD -->

                    <tr>

                        <td
                            align="center"
                            style="padding-top: 14px;"
                        >

                            <a
                                href="dashboard.html"
                                style="
                                    text-decoration: none;
                                    color: black;
                                    font-size: 13px;
                                    font-weight: bold;
                                "
                            >
                                Dashboard
                            </a>

                        </td>

                    </tr>


                    <!-- PROFIL AKTIF -->

                    <tr>

                        <td
                            align="center"
                            style="padding-top: 20px;"
                        >

                            <a
                                href="profil.html"
                                style="
                                    display: block;
                                    width: 150px;
                                    padding: 10px 0;
                                    background-color: #909090;
                                    color: black;
                                    text-decoration: none;
                                    font-size: 13px;
                                    font-weight: bold;
                                    border-radius: 5px;
                                    box-shadow: 4px 4px 6px rgba(0,0,0,0.25);
                                "
                            >
                                Profil
                            </a>

                        </td>

                    </tr>


                    <!-- RIWAYAT -->

                    <tr>

                        <td
                            align="center"
                            style="padding-top: 22px;"
                        >

                            <a
                                href="riwayat.html"
                                style="
                                    text-decoration: none;
                                    color: black;
                                    font-size: 13px;
                                    font-weight: bold;
                                "
                            >
                                Riwayat
                            </a>

                        </td>

                    </tr>


                    <!-- SETTINGS -->

                    <tr>

                        <td
                            align="center"
                            style="padding-top: 22px;"
                        >

                            <a
                                href="settings.html"
                                style="
                                    text-decoration: none;
                                    color: black;
                                    font-size: 13px;
                                    font-weight: bold;
                                "
                            >
                                Settings
                            </a>

                        </td>

                    </tr>

                </table>

            </td>


            <!-- ================= AREA PROFIL ================= -->

            <td
                align="center"
                valign="top"
            >

                <br><br>


                <!-- ================= CARD PROFIL ================= -->

                <table
                    width="430"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                    bgcolor="#e6f2ff"
                    style="
                        border-radius: 8px;
                        box-shadow: 6px 7px 10px rgba(0,0,0,0.22);
                    "
                >

                    <!-- ================= JUDUL ================= -->

                    <tr>

                        <td
                            align="center"
                            style="
                                padding-top: 12px;
                                padding-bottom: 8px;
                            "
                        >

                            <b
                                style="
                                    font-size: 18px;
                                "
                            >
                                Edit Profil
                            </b>

                        </td>

                    </tr>


                    <!-- ================= FOTO PROFIL ================= -->

                    <tr>

                        <td
                            style="
                                padding-left: 20px;
                                padding-right: 20px;
                            "
                        >

                            <b
                                style="
                                    font-size: 11px;
                                "
                            >
                                Foto Profil
                            </b>

                            <br>

                            <table
                                width="65"
                                height="65"
                                border="0"
                                cellpadding="0"
                                cellspacing="0"
                                bgcolor="#909090"
                                style="
                                    margin-top: 5px;
                                    border-radius: 4px;
                                    box-shadow: 4px 4px 6px rgba(0,0,0,0.20);
                                "
                            >
                                <tr>
                                    <td>
                                    </td>
                                </tr>
                            </table>

                        </td>

                    </tr>


                    <!-- ================= NAMA ================= -->

                    <tr>

                        <td
                            style="
                                padding-left: 20px;
                                padding-right: 20px;
                                padding-top: 8px;
                            "
                        >

                            <b
                                style="
                                    font-size: 11px;
                                "
                            >
                                Nama
                            </b>

                            <br>

                            <input
                                type="text"
                                name="nama"
                                style="
                                    width: 90px;
                                    height: 18px;
                                    margin-top: 4px;
                                    background-color: #909090;
                                    border: none;
                                    box-shadow: 4px 4px 5px rgba(0,0,0,0.20);
                                "
                            >

                        </td>

                    </tr>


                    <!-- ================= USERNAME ================= -->

                    <tr>

                        <td
                            style="
                                padding-left: 20px;
                                padding-right: 20px;
                                padding-top: 8px;
                            "
                        >

                            <b
                                style="
                                    font-size: 11px;
                                "
                            >
                                Username
                            </b>

                            <br>

                            <input
                                type="text"
                                name="username"
                                style="
                                    width: 90px;
                                    height: 18px;
                                    margin-top: 4px;
                                    background-color: #909090;
                                    border: none;
                                    box-shadow: 4px 4px 5px rgba(0,0,0,0.20);
                                "
                            >

                        </td>

                    </tr>


                    <!-- ================= BIO ================= -->

                    <tr>

                        <td
                            style="
                                padding-left: 20px;
                                padding-right: 20px;
                                padding-top: 8px;
                            "
                        >

                            <b
                                style="
                                    font-size: 11px;
                                "
                            >
                                Bio
                            </b>

                            <br>

                            <textarea
                                name="bio"
                                rows="4"
                                style="
                                    width: 285px;
                                    height: 55px;
                                    margin-top: 4px;
                                    background-color: #909090;
                                    border: none;
                                    resize: none;
                                    box-shadow: 4px 4px 5px rgba(0,0,0,0.20);
                                "
                            ></textarea>

                        </td>

                    </tr>


                    <!-- ================= INSTAGRAM ================= -->

                    <tr>

                        <td
                            style="
                                padding-left: 20px;
                                padding-right: 20px;
                                padding-top: 8px;
                            "
                        >

                            <b
                                style="
                                    font-size: 11px;
                                "
                            >
                                Instagram
                            </b>

                            <br>

                            <input
                                type="text"
                                name="instagram"
                                style="
                                    width: 285px;
                                    height: 18px;
                                    margin-top: 4px;
                                    background-color: #909090;
                                    border: none;
                                    box-shadow: 4px 4px 5px rgba(0,0,0,0.20);
                                "
                            >

                        </td>

                    </tr>


                    <!-- ================= YOUTUBE ================= -->

                    <tr>

                        <td
                            style="
                                padding-left: 20px;
                                padding-right: 20px;
                                padding-top: 8px;
                            "
                        >

                            <b
                                style="
                                    font-size: 11px;
                                "
                            >
                                Youtube
                            </b>

                            <br>

                            <input
                                type="text"
                                name="youtube"
                                style="
                                    width: 285px;
                                    height: 18px;
                                    margin-top: 4px;
                                    background-color: #909090;
                                    border: none;
                                    box-shadow: 4px 4px 5px rgba(0,0,0,0.20);
                                "
                            >

                        </td>

                    </tr>


                    <!-- ================= TOMBOL SIMPAN ================= -->

                    <tr>

                        <td
                            align="center"
                            style="
                                padding-top: 12px;
                                padding-bottom: 12px;
                            "
                        >

                            <input
                                type="submit"
                                value="SIMPAN"
                                style="
                                    width: 65px;
                                    height: 25px;
                                    background-color: #168acb;
                                    color: black;
                                    font-size: 10px;
                                    font-weight: bold;
                                    border: none;
                                    border-radius: 5px;
                                    box-shadow: 3px 3px 5px rgba(0,0,0,0.25);
                                "
                            >

                        </td>

                    </tr>

                </table>

            </td>

        </tr>

    </table>

</body>
</html>
